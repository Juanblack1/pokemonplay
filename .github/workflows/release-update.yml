name: Publicar atualização do Pokémon Play
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Bloquear publicação enquanto a auditoria estiver pendente
        shell: pwsh
        run: |
          $readiness = Get-Content -Raw ./RELEASE_READINESS.md
          if ($readiness -notmatch '(?m)^<!-- public-release-status: ready -->\s*$') {
            throw 'Publicação bloqueada: RELEASE_READINESS.md ainda não marca a distribuição como pronta.'
          }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Preparar emuladores e fontes oficiais
        shell: pwsh
        run: ./recovered-source/tools/prepare-emulators.ps1 -Directory '${{ runner.temp }}/pokemonplay-emulators'
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: MINGW64
          update: true
          install: git pkgconf mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Compilar os cores incluídos
        shell: msys2 {0}
        env:
          POKEMONPLAY_EMULATOR_BUILD: ${{ runner.temp }}/pokemonplay-emulators
        run: bash ./recovered-source/tools/build-emulator-cores.sh
      - name: Verificar binários reais e empacotar fontes correspondentes
        shell: pwsh
        run: ./recovered-source/tools/verify-emulator-bundle.ps1 -Directory '${{ runner.temp }}/pokemonplay-emulators' -OutputDirectory '${{ runner.temp }}/pokemonplay-sources'
      - name: Verificar a aplicação e o atualizador
        shell: pwsh
        run: dotnet run --configuration Release --project ./recovered-source/tests/ProfilesCheck/Check.csproj
      - name: Preparar compilador do instalador
        shell: pwsh
        run: |
          $compiler = ./recovered-source/tools/prepare-installer-tool.ps1
          "POKEMONPLAY_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compilar pacote do aplicativo (assinatura opcional)
        shell: pwsh
        env:
          POKEMONPLAY_SIGNING_PFX_BASE64: ${{ secrets.POKEMONPLAY_SIGNING_PFX_BASE64 }}
          POKEMONPLAY_SIGNING_PFX_PASSWORD: ${{ secrets.POKEMONPLAY_SIGNING_PFX_PASSWORD }}
        run: ./recovered-source/tools/publish-update.ps1 -Tag '${{ github.ref_name }}' -Repository '${{ github.repository }}' -OutputDirectory '${{ runner.temp }}/pokemonplay-release' -EmulatorDirectory '${{ runner.temp }}/pokemonplay-emulators/Emulators' -InstallerCompilerPath $env:POKEMONPLAY_ISCC
      - name: Verificar instalação e preservação dos dados
        shell: pwsh
        run: ./recovered-source/tools/verify-release-installer.ps1 -ReleaseDirectory '${{ runner.temp }}/pokemonplay-release' -CompilerPath $env:POKEMONPLAY_ISCC
      - name: Publicar release estável
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_OUTPUT: ${{ runner.temp }}/pokemonplay-release
        run: |
          gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --verify-tag --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Não foi possível criar a release.' }
          }
          $draft = gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'A release precisa estar em rascunho antes do upload.' }
          gh release upload $env:RELEASE_TAG "$env:RELEASE_OUTPUT/pokemon-play-win-x64-update.zip" "$env:RELEASE_OUTPUT/pokemon-play-win-x64-update.zip.sha256" "$env:RELEASE_OUTPUT/pokemon-play-win-x64-portable.zip" "$env:RELEASE_OUTPUT/pokemon-play-win-x64-portable.zip.sha256" "$env:RELEASE_OUTPUT/pokemon-play-win-x64-setup.exe" "$env:RELEASE_OUTPUT/pokemon-play-win-x64-setup.exe.sha256" "${{ runner.temp }}/pokemonplay-sources/pokemon-play-emulator-sources.zip" "${{ runner.temp }}/pokemonplay-sources/pokemon-play-emulator-sources.zip.sha256" --repo $env:RELEASE_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível publicar o pacote.' }
          $assets = gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $assets.assets.Count -ne 8) { throw 'Release incompleta; mantida em rascunho.' }
          gh release edit $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível liberar a release completa.' }
