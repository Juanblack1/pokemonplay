name: Verificar ciclo de melhorias
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'recovered-source/main-app/**'
      - 'recovered-source/tests/ProfilesCheck/**'
      - '.github/workflows/engineering-cycle.yml'
permissions:
  contents: read
jobs:
  application-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verificar atribuições acessíveis nas configurações
        timeout-minutes: 3
        shell: pwsh
        run: |
          dotnet build --configuration Release ./recovered-source/tests/ProfilesCheck/Check.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $check = (Resolve-Path './recovered-source/tests/ProfilesCheck/bin/Release/net10.0-windows/Check.exe').Path
          $stdout = Join-Path '${{ runner.temp }}' 'accessibility.stdout.log'
          $stderr = Join-Path '${{ runner.temp }}' 'accessibility.stderr.log'
          $process = Start-Process -FilePath $check -ArgumentList '--keybinding-accessibility' -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(120000)) {
            if (-not $process.HasExited) { $process.Kill(); $null = $process.WaitForExit(5000) }
            throw 'Owned accessibility check exceeded its deadline.'
          }
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          if ($process.ExitCode -ne 0) { throw 'Accessibility checks failed.' }
      - name: Verificar feedback de tecla reservada
        timeout-minutes: 3
        shell: pwsh
        run: |
          $check = (Resolve-Path './recovered-source/tests/ProfilesCheck/bin/Release/net10.0-windows/Check.exe').Path
          $stdout = Join-Path '${{ runner.temp }}' 'reserved-key.stdout.log'
          $stderr = Join-Path '${{ runner.temp }}' 'reserved-key.stderr.log'
          $process = Start-Process -FilePath $check -ArgumentList '--reserved-key-feedback' -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(120000)) {
            if (-not $process.HasExited) { $process.Kill(); $null = $process.WaitForExit(5000) }
            throw 'Owned reserved-key check exceeded its deadline.'
          }
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          if ($process.ExitCode -ne 0) { throw 'Reserved-key checks failed.' }
      - name: Compilar e testar aplicação e atualizador
        shell: pwsh
        env:
          POKEMONPLAY_CONTROLS_PREVIEW: ${{ runner.temp }}/controls-preview
          POKEMONPLAY_LIBRARY_PREVIEW: ${{ runner.temp }}/library-preview
        run: |
          dotnet run --configuration Release --project ./recovered-source/tests/ProfilesCheck/Check.csproj 2>&1 | Tee-Object -FilePath '${{ runner.temp }}/checks.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Guardar resultado do ciclo
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: engineering-cycle-evidence
          path: |
            ${{ runner.temp }}/reserved-key.stdout.log
            ${{ runner.temp }}/reserved-key.stderr.log
            ${{ runner.temp }}/checks.log
            ${{ runner.temp }}/controls-preview/*.png
            ${{ runner.temp }}/library-preview/*.png
            ${{ runner.temp }}/accessibility.stdout.log
            ${{ runner.temp }}/accessibility.stderr.log
