name: Verificar ciclo de melhorias
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'recovered-source/main-app/**'
      - 'recovered-source/tests/ProfilesCheck/**'
      - 'recovered-source/tools/verify-ci-embedding-display.ps1'
      - '.github/workflows/engineering-cycle.yml'
permissions:
  contents: read
jobs:
  application-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verificar encerramento de sessão com falha e filho GUI próprio
        timeout-minutes: 4
        shell: pwsh
        run: |
          dotnet build --configuration Release ./recovered-source/tests/ProfilesCheck/Check.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixture = Join-Path '${{ runner.temp }}' 'embedding-lifecycle'
          $check = (Resolve-Path './recovered-source/tests/ProfilesCheck/bin/Release/net10.0-windows/Check.exe').Path
          ./recovered-source/tools/verify-ci-embedding-display.ps1 -CheckPath $check -FixtureRoot $fixture -OwnedCiDesktop
      - name: Compilar e testar aplicação e atualizador
        shell: pwsh
        env:
          POKEMONPLAY_CONTROLS_PREVIEW: ${{ runner.temp }}/controls-preview
          POKEMONPLAY_LIBRARY_PREVIEW: ${{ runner.temp }}/library-preview
        run: |
          dotnet run --configuration Release --project ./recovered-source/tests/ProfilesCheck/Check.csproj 2>&1 | Tee-Object -FilePath '${{ runner.temp }}/checks.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Guardar resultado do ciclo
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: engineering-cycle-evidence
          path: |
            ${{ runner.temp }}/checks.log
            ${{ runner.temp }}/controls-preview/*.png
            ${{ runner.temp }}/library-preview/*.png
            ${{ runner.temp }}/embedding-lifecycle.stdout.log
            ${{ runner.temp }}/embedding-lifecycle.stderr.log
            ${{ runner.temp }}/embedding-lifecycle/**
            ${{ runner.temp }}/embedding-lifecycle-display/**
