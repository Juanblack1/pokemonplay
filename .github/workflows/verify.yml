name: Verificar pull requests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recovered-source/tests/FirestoreRulesCheck
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Verificar isolamento por UID no emulador local
        run: npx -y firebase-tools@latest emulators:exec --only firestore --project demo-pokemonplay-rules "npm test"
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Preparar emuladores e fontes oficiais
        shell: pwsh
        run: ./recovered-source/tools/prepare-emulators.ps1 -Directory '${{ runner.temp }}/pokemonplay-emulators'
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: MINGW64
          update: true
          install: git pkgconf mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Compilar os cores incluídos
        shell: msys2 {0}
        env:
          POKEMONPLAY_EMULATOR_BUILD: ${{ runner.temp }}/pokemonplay-emulators
        run: bash ./recovered-source/tools/build-emulator-cores.sh
      - name: Verificar binários reais e empacotar fontes correspondentes
        shell: pwsh
        run: ./recovered-source/tools/verify-emulator-bundle.ps1 -Directory '${{ runner.temp }}/pokemonplay-emulators' -OutputDirectory '${{ runner.temp }}/pokemonplay-sources'
      - name: Executar ProfilesCheck
        shell: pwsh
        run: dotnet run --configuration Release --project ./recovered-source/tests/ProfilesCheck/Check.csproj
      - name: Compilar e validar o pacote Windows
        shell: pwsh
        run: |
          $compiler = ./recovered-source/tools/prepare-installer-tool.ps1
          ./recovered-source/tools/publish-update.ps1 -Tag 'v171.9.0' -Repository '${{ github.repository }}' -OutputDirectory '${{ runner.temp }}/pokemonplay-verify' -EmulatorDirectory '${{ runner.temp }}/pokemonplay-emulators/Emulators' -InstallerCompilerPath $compiler
          ./recovered-source/tools/verify-release-installer.ps1 -ReleaseDirectory '${{ runner.temp }}/pokemonplay-verify' -CompilerPath $compiler
