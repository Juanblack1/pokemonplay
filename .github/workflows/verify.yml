name: Verificar pull requests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recovered-source/tests/FirestoreRulesCheck
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Verificar isolamento por UID no emulador local
        run: npx -y firebase-tools@latest emulators:exec --only firestore --project demo-pokemonplay-rules "npm test"
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Executar ProfilesCheck
        shell: pwsh
        run: dotnet run --configuration Release --project ./recovered-source/tests/ProfilesCheck/Check.csproj
      - name: Compilar e validar o pacote Windows
        shell: pwsh
        run: ./recovered-source/tools/publish-update.ps1 -Tag 'v171.1.0' -Repository '${{ github.repository }}' -OutputDirectory '${{ runner.temp }}/pokemonplay-verify'
