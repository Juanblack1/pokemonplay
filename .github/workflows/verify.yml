name: Verificar pull requests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Executar ProfilesCheck
        shell: pwsh
        run: dotnet run --configuration Release --project ./recovered-source/tests/ProfilesCheck/Check.csproj
      - name: Compilar e validar o pacote Windows
        shell: pwsh
        run: ./recovered-source/tools/publish-update.ps1 -Tag 'v171' -Repository '${{ github.repository }}' -OutputDirectory '${{ runner.temp }}/pokemonplay-verify'
